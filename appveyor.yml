# http://www.appveyor.com/docs/appveyor-yml

branches:
  only:
    - develop
    - main
    - /\d*\.\d*\.\d*/

environment:
  # bad, but without this, gitversion doesn't work anymore
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: 1
  azure-key-vault-url:
    secure: 1mKS/HfCVq+iYNRVSrrN8NEowOkKt3knrpMzw+SOy3g=
  azure-key-vault-client-id:
    secure: JfSqzmsJdXB6uIxttCRoQw1NygwxqXHDj9uIqQnWOb9VCnQYlRPlAnxgW0yTSX4b
  azure-key-vault-tenant-id:
    secure: FxjkcqtpulfpDpfSAu4onaLVP/H1S1ORRCQCqsZkDC6YhCSmFoMxYNsWv5uGe3ah
  azure-key-vault-client-secret:
    secure: CUpRJxMLeUZwNPMcqI0wECaWfy5AMnWn1UZhBd9WnQ3Z16lJP1Vzrkf24mccbhUD
  azure-key-vault-certificate:
    secure: BSPdW2TgnQtoQXXbeDECug==
  SignPath_ApiToken:
    secure: IsW0HCtIqBHi8oOjEOdFIc8T0Nur5ooPTqK4+aDT57EC+RgK5FIM+hBfhkFTRRZu
  SignPath_OrganizationId:
    secure: aGxEA2pQI61oOKRFVW3jWQ4+IwST32pdb4uy1W6g7HyD5jrZpWEjLwvD4uLHYlRh
  SignPath_SigningPolicySlug:
    secure: SWZaNfP7arLimR05NS08cw==

image: Visual Studio 2026
test: false

install:
  # Appveyor uses git checkout -qf FETCH_HEAD but all GitVersion versions above 5.6.3 doesn't support this detached header
  # This is a workaround for this issue
  - ps: |
      if ($env:APPVEYOR_PULL_REQUEST_HEAD_COMMIT -ne "")
      {
        git checkout -qf $($env:APPVEYOR_PULL_REQUEST_HEAD_COMMIT)
      }
  - ps: Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1'
  - ps: ./dotnet-install.ps1 -Version 6.0.428 -InstallDir "C:\Program Files\dotnet"

pull_requests:
  do_not_increment_build_number: false

build_script:
  - ps: dotnet --info
  # - ps: gitversion /version
  - ps: .\build.ps1 --target=ci --verbosity=diagnostic

# A red build skips after_build, and a red build is exactly the one whose test results are worth
# reading, so the upload happens at the end either way. The sequence file the blame collector
# writes when a test stops moving comes along, because it names that test. The dump next to it
# stays on the agent: it is a picture of the test host memory, artifacts of a public project are
# public, and the signing secrets are in the environment the test host inherited.
on_finish:
  - ps: |
      if (Test-Path .\TestResults)
      {
        gci -Filter *.trx -Path .\TestResults\ | % { (New-Object 'System.Net.WebClient').UploadFile("https://ci.appveyor.com/api/testresults/mstest/$($env:APPVEYOR_JOB_ID)", (Resolve-Path $_.FullName)) }
        gci -Path .\TestResults\ -Recurse -Include Sequence_*.xml | % { Push-AppveyorArtifact $_.FullName -FileName $_.Name }
      }

artifacts:
  - path: \Publish\*.*

nuget:
  disable_publish_on_pr: true

skip_commits:
  files:
    - '**/*.md'
